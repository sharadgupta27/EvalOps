name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Lint openapi.yaml (Spectral)
        run: npx --yes @stoplight/spectral-cli@6 lint openapi.yaml --fail-severity=error
      - name: Generated TS client is up to date
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts || (echo "::error::Run 'npm run gen:api' and commit the result" && exit 1)

  backend:
    name: Backend (lint, types, unit + integration tests)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, cache-dependency-glob: backend/uv.lock }
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - name: Unit tests (SQLite)
        run: uv run pytest -m "not integration" --cov=app --cov-report=xml --cov-report=term
      - name: Integration tests (Postgres via testcontainers)
        run: uv run pytest -m integration
      - name: Judge calibration smoke test (FakeProvider)
        run: uv run python -m app.evaluators.calibrate --min-agreement 0.8
      - uses: actions/upload-artifact@v4
        with: { name: backend-coverage, path: backend/coverage.xml }

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build

  agent-pack:
    name: Agent extension pack (hooks, MCP server, plugin sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Plugin and .claude copies are in sync with sources
        run: python3 agent-hooks/install.py --check
      - name: Guardrail hook tests
        run: python3 -m unittest discover -s agent-hooks/tests -v
      - name: MCP server tests
        working-directory: mcp-server
        run: uv sync --python 3.12 && uv run pytest -q

  e2e:
    name: E2E (Docker Compose + Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Seed demo data
        run: docker compose run --rm api python -m app.seed
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: e2e/package-lock.json }
      - name: Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: e2e/playwright-report, if-no-files-found: ignore }

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secrets (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --config /repo/.gitleaks.toml --redact --exit-code 1
      - name: SAST (Semgrep)
        run: docker run --rm -v "$PWD:/src" semgrep/semgrep:1.99.0 semgrep scan --config p/python --config p/typescript --config p/dockerfile --error --metrics=off /src
      - name: Dependencies, IaC and secrets (Trivy filesystem scan)
        run: docker run --rm -v "$PWD:/src" aquasec/trivy:0.57.1 fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 1 --ignorefile /src/.trivyignore /src
      - uses: astral-sh/setup-uv@v6
      - name: Python dependency audit (pip-audit)
        working-directory: backend
        run: uv export --frozen --no-dev --format requirements-txt > /tmp/req.txt && uvx pip-audit -r /tmp/req.txt --strict
      - name: npm audit (production deps)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
