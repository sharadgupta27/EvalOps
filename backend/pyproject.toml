[project]
name = "evalops-backend"
version = "1.0.0"
description = "EvalOps API and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.32",
    "aiosqlite>=0.20",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.9",
    "anthropic>=1.0",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-jsonschema",
    "types-PyYAML",
    "testcontainers[postgres]>=4.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
# UP040/UP046/UP047: we keep TypeVar (not PEP 695) so Semgrep can parse every file.
ignore = ["S101", "B008", "RUF012", "UP040", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs Docker (Postgres via testcontainers)"]
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["app/seed.py", "app/worker/__main__.py"]
concurrency = ["greenlet", "thread"]
