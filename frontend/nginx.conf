server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 3m;

  # Re-resolve the api container through Docker's DNS so a restarted api (new IP) keeps working.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location = /healthz {
    proxy_pass $api_upstream;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: unknown paths fall back to index.html.
  location / {
    try_files $uri /index.html;
  }
}
