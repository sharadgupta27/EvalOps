[project]
name = "evalops-mcp"
version = "1.0.0"
description = "MCP server exposing a scoped, read-mostly view of EvalOps to coding agents"
requires-python = ">=3.12"
dependencies = ["mcp>=1.2", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
