# Alertmanager: groups, deduplicates, routes and silences alerts that Prometheus fires.
# Local default: both receivers post to ops/alertmanager/alert_sink.py, which prints one line
# per alert (`docker compose ... logs alert-sink`). In production, swap the webhook for a
# real channel (examples at the bottom); keep the routing tree as is.

route:
  receiver: ticket
  group_by: [alertname]
  group_wait: 30s       # wait for related alerts before the first notification
  group_interval: 5m    # batch new alerts in an existing group
  repeat_interval: 4h   # re-notify while an alert keeps firing
  routes:
    # severity: page means "someone should look now" (WorkerDown, EvalQueueStuck).
    - matchers: ['severity="page"']
      receiver: page
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: page
    webhook_configs:
      - url: http://alert-sink:8080/page
        send_resolved: true
  - name: ticket
    webhook_configs:
      - url: http://alert-sink:8080/ticket
        send_resolved: true

inhibit_rules:
  # A dead worker always makes the queue stuck. Send the cause, not the symptom.
  - source_matchers: ['alertname="WorkerDown"']
    target_matchers: ['alertname="EvalQueueStuck"']

