# Observability add-on. Run together with the main stack:
#   docker compose -f docker-compose.yml -f ops/docker-compose.observability.yml up -d --build
# Grafana: http://localhost:3000 (anonymous viewer)  Prometheus: http://localhost:9090
# Alertmanager: http://localhost:9093 (alerts are delivered to the alert-sink container's log)
# Traces: api/worker -> OTel Collector -> Tempo; metrics: Prometheus scrapes api, worker, collector.

services:
  api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  worker:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: evalops-worker

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: [./ops/otel-collector.yaml:/etc/otelcol/config.yaml:ro]
    depends_on: [tempo]

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: [./ops/tempo.yaml:/etc/tempo.yaml:ro]

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    depends_on: [alertmanager]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes: [./ops/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro]
    ports: ["9093:9093"]
    depends_on: [alert-sink]

  # Stand-in for Slack/PagerDuty: prints each delivered alert as one JSON line.
  alert-sink:
    image: python:3.12-slim
    command: ["python", "-u", "/sink/alert_sink.py", "8080"]
    volumes: [./ops/alertmanager/alert_sink.py:/sink/alert_sink.py:ro]

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin  # local only
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, tempo]
