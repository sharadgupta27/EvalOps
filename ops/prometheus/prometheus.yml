global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: evalops-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels: { env: dev }
  - job_name: evalops-worker
    static_configs:
      - targets: ["worker:9101"]
        labels: { env: dev }
  - job_name: otel-spanmetrics
    static_configs:
      - targets: ["otel-collector:8889"]
